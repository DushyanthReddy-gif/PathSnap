[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathsnap"
version = "0.1.0"
description = "PathSnap: High-accuracy map matching and trajectory reconstruction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "scipy>=1.10.0",
    "scikit-learn>=1.3.0",
    "pyarrow>=12.0.0",
    "optuna>=3.2.0",
    "matplotlib>=3.7.0",
    "joblib>=1.3.0",
    "pyyaml>=6.0",
    "folium>=0.14.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.22.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "streamlit>=1.25.0",
    "streamlit-folium>=0.13.0"
]

[tool.setuptools.packages.find]
where = ["src"]
