# P2 (Aditya) - the 5 models compared for report §3 (one per algorithm family).
# family        : algorithm family reported in the §3.1 table
# estimator     : key into pathsnap.models.registry.ESTIMATORS
# params        : initial hyperparameters (report §3.2 Q5)
# scale         : put a StandardScaler before the model (needed by gradient-trained linear models)
# max_train_obs : train on a random subset of this many GPS observations (whole observations,
#                 all their candidates) - only where the full table would be too slow.
seed: 42
cv_folds: 5

models:
  logreg:
    family: Linear
    estimator: logistic_regression
    scale: true
    params: {C: 1.0, max_iter: 1000}

  gaussian_nb:
    family: Probabilistic (generative)
    estimator: gaussian_nb
    scale: false
    params: {var_smoothing: 1.0e-9}

  decision_tree:
    family: Tree-based
    estimator: decision_tree
    scale: false
    params: {max_depth: 10, min_samples_leaf: 50, criterion: gini}

  random_forest:
    family: Ensemble (bagging)
    estimator: random_forest
    scale: false
    max_train_obs: 60000          # keeps fit time and model file size under control
    params: {n_estimators: 100, max_depth: 12, min_samples_leaf: 20, n_jobs: -1}

  hist_gb:
    family: Boosting
    estimator: hist_gradient_boosting
    scale: false
    params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 20,
             l2_regularization: 0.0, early_stopping: true}
