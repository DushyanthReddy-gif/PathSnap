# P2 (Aditya) - every model compared for report §3. Keep every model ever tried in this file.
# family     : algorithm family reported in the §3.1 table
# estimator  : key into pathsnap.models.registry.ESTIMATORS
# params     : initial hyperparameters (report §3.2 Q5)
# scale      : put a StandardScaler before the model (distance/gradient based models need it)
# max_train_obs : train on a random subset of this many GPS observations (whole observations,
#                 all their candidates) - only for models that are too slow on the full table.
seed: 42
cv_folds: 5

models:
  logreg:
    family: Linear / probabilistic
    estimator: logistic_regression
    scale: true
    params: {C: 1.0, max_iter: 1000}

  gaussian_nb:
    family: Probabilistic (generative)
    estimator: gaussian_nb
    scale: false
    params: {var_smoothing: 1.0e-9}

  knn:
    family: Instance-based
    estimator: knn
    scale: true
    max_train_obs: 30000          # KNN compares every query with every stored row -> subsample
    params: {n_neighbors: 25, weights: distance, n_jobs: -1}

  extra_trees:
    family: Ensemble (randomised trees)
    estimator: extra_trees
    scale: false
    max_train_obs: 60000          # keeps fit time and model size (< 50 MB) under control
    params: {n_estimators: 100, max_depth: 14, min_samples_leaf: 20, n_jobs: -1}

  hist_gb:
    family: Boosting
    estimator: hist_gradient_boosting
    scale: false
    params: {learning_rate: 0.1, max_iter: 300, max_leaf_nodes: 31, min_samples_leaf: 20,
             l2_regularization: 0.0, early_stopping: true}

  lightgbm:
    family: Boosting
    estimator: lightgbm
    scale: false
    params: {n_estimators: 400, learning_rate: 0.05, num_leaves: 63, min_child_samples: 20,
             subsample: 0.8, subsample_freq: 1, colsample_bytree: 0.8, verbose: -1}

  mlp:
    family: Neural network
    estimator: mlp
    scale: true
    max_train_obs: 80000
    params: {hidden_layer_sizes: [64, 32], alpha: 1.0e-4, learning_rate_init: 1.0e-3,
             batch_size: 512, max_iter: 40, early_stopping: true, n_iter_no_change: 5}
