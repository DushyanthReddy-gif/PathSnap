# HMM decoder parameters (P3 — Leka)
# All values can be overridden at runtime via the params dict passed to decode().
# The pipeline (pipeline.py) reads sigma_z and penalty_disconnected;
# viterbi.decode() reads sigma_m, beta, alpha, gap_s, cutoff_m, max_obs.
# Both sets are kept here so either caller gets its expected key.

# --- Emission / noise ---
sigma_m: 20.0          # GPS noise std-dev (metres) — Gaussian emission (viterbi.decode)
sigma_z: 20.0          # Alias used by pipeline.py internal fallback decoder

# --- Transition ---
beta: 20.0             # Transition smoothness (metres) — Newson & Krumm §3.2

# --- Classifier blend ---
alpha: 0.0             # Blend weight for classifier probability (0 = distance-only v1)
use_classifier_probabilities: false   # Legacy flag read by pipeline stub

# --- Penalty ---
penalty_disconnected: -1000.0   # Log-penalty for unreachable arc pairs (finite, not -inf)

# --- Gap / segment splitting ---
gap_s: 60.0            # Δt threshold (seconds) to split into segments
max_speed_ms: 50.0     # Implied speed threshold (m/s) ~180 km/h

# --- Search ---
cutoff_m: 2000.0       # Dijkstra cutoff (metres) for transition search
max_obs: 5000          # Downsample above this many obs per segment for speed
