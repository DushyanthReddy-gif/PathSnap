# Candidate generation + dataset-building settings (owner: P1)
radius_m: 50          # a road is a candidate if it passes within this many metres of the GPS point
max_k: 8              # keep only the K nearest candidate roads per GPS point
train_obs_stride: 3   # use every 3rd GPS point of the 80 train trips (keeps training fast)
label_ok_max_dist_m: 50   # a label is trusted only if the GPS point is within this distance of its reference road
